<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="sunburstGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF04B" />
      <stop offset="70%" stop-color="#FFD000" />
      <stop offset="92%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>

    <radialGradient id="innerPlateGrad" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#FFF566" />
      <stop offset="75%" stop-color="#FFD600" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="lampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Path for Top Devanagari Arc -->
    <!-- Center (300, 300), Radius ~195 -->
    <path id="topMottoArc" d="M 125,330 A 190,190 0 1,1 475,330" fill="none" />
    
    <!-- Path for Bottom Devanagari Arc (Clockwise on underside) -->
    <!-- Center (300, 300), Radius ~195 -->
    <path id="bottomMottoArc" d="M 475,270 A 190,190 0 0,1 125,270" fill="none" />
  </defs>

  <!-- ==================== OUTER SUNBURST / PETAL BORDER ==================== -->
  <g id="outer-petals" transform="translate(300, 300)">
    <!-- 24 Petals radiating around circle (R_outer = 285, R_inner = 230) -->
    <!-- We repeat 24 petals rotated by 15 deg -->
    <g stroke="#DC2626" stroke-width="2.2" stroke-linejoin="round">
      <!-- Petal definitions mapped around 360 deg -->
      <g>
        <path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" />
        <path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" />
      </g>
      <!-- Repeat 23 more petals -->
      <g transform="rotate(15)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(30)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(45)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(60)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(75)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(90)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(105)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(120)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(135)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(150)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(165)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(180)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(195)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(210)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(225)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(240)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(255)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(270)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(285)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(300)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(315)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(330)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
      <g transform="rotate(345)"><path d="M 0,-225 C -16,-245 -22,-270 0,-292 C 22,-270 16,-245 0,-225 Z" fill="#FFE033" /><path d="M 0,-235 C -8,-252 -10,-268 0,-282 C 10,-268 8,-252 0,-235 Z" fill="#FFF566" /></g>
    </g>

    <!-- Radiating Fine Inner Rays Ring -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="#DC2626" stroke-width="2.5" />
    <circle cx="0" cy="0" r="222" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>

  <!-- ==================== CENTRAL GOLDEN DISC ==================== -->
  <circle cx="300" cy="300" r="220" fill="url(#innerPlateGrad)" stroke="#B91C1C" stroke-width="3" />
  <circle cx="300" cy="300" r="214" fill="none" stroke="#DC2626" stroke-width="1.5" />

  <!-- ==================== SANSKRIT MOTTO (Devanagari) ==================== -->
  <!-- Top: "प्रतिपच्चंद्रलेखेव वर्धिष्णुर्विश्व वंदिता" -->
  <g fill="#991B1B" font-family="'Noto Sans Devanagari', 'Mangal', 'Yashomudra', Arial, sans-serif" font-weight="900" font-size="22.5" letter-spacing="0.5">
    <text>
      <textPath href="#topMottoArc" startOffset="50%" textAnchor="middle">
        प्रतिपच्चंद्रलेखेव वर्धिष्णुर्विश्व वंदिता
      </textPath>
    </text>

    <!-- Side Separator Dots -->
    <circle cx="114" cy="290" r="4.5" fill="#B91C1C" />
    <circle cx="486" cy="290" r="4.5" fill="#B91C1C" />

    <!-- Bottom: "महाराष्ट्रस्य राज्यस्य मुद्रा भद्राय राजते" -->
    <text>
      <textPath href="#bottomMottoArc" startOffset="50%" textAnchor="middle">
        महाराष्ट्रस्य राज्यस्य मुद्रा भद्राय राजते
      </textPath>
    </text>
  </g>

  <!-- ==================== CENTRAL SAMAI / DEEPJYOTI (Traditional Lamp) ==================== -->
  <g id="central-samai" stroke="#991B1B" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 1. Glowing Flames Wicks (Orange-Red Outline with Yellow/Gold Fill) -->
    <!-- Center top flame -->
    <path d="M 300 132 C 294 148 290 162 300 178 C 310 162 306 148 300 132 Z" fill="url(#flameGrad)" />
    
    <!-- Left flames -->
    <path d="M 218 220 C 210 240 220 260 234 266 C 230 250 228 235 218 220 Z" fill="url(#flameGrad)" />
    <path d="M 235 200 C 230 220 240 240 252 248 C 248 230 246 215 235 200 Z" fill="url(#flameGrad)" />
    <path d="M 260 170 C 255 190 268 215 278 220 C 275 200 270 185 260 170 Z" fill="url(#flameGrad)" />

    <!-- Right flames -->
    <path d="M 382 220 C 390 240 380 260 366 266 C 370 250 372 235 382 220 Z" fill="url(#flameGrad)" />
    <path d="M 365 200 C 370 220 360 240 348 248 C 352 230 354 215 365 200 Z" fill="url(#flameGrad)" />
    <path d="M 340 170 C 345 190 332 215 322 220 C 325 200 330 185 340 170 Z" fill="url(#flameGrad)" />

    <!-- 2. Finial & Crown (Kalash / Shikhar) -->
    <!-- Top pinnacle drop -->
    <circle cx="300" cy="148" r="5" fill="#FFE500" />
    <path d="M 296 153 C 293 162 290 170 300 175 C 310 170 307 162 304 153 Z" fill="#FFCC00" />
    <ellipse cx="300" cy="180" rx="9" ry="5" fill="#FFE500" />
    <circle cx="300" cy="195" r="11" fill="#FFD700" />
    <ellipse cx="300" cy="210" rx="14" ry="6" fill="#FFE500" />
    <path d="M 288 210 L 284 235 L 316 235 L 312 210 Z" fill="#FFC000" />

    <!-- 3. Upper Oil Bowl & Beaded Rim -->
    <ellipse cx="300" cy="240" rx="42" ry="12" fill="#FFE033" />
    <path d="M 258 240 C 265 272 335 272 342 240 Z" fill="#FFB703" />
    
    <!-- Multi-tier Petal Bowl Wings -->
    <path d="M 226 266 C 242 284 270 292 300 292 C 330 292 358 284 374 266 C 356 312 244 312 226 266 Z" fill="#FFE500" />
    <path d="M 240 286 C 260 318 340 318 360 286 C 340 330 260 330 240 286 Z" fill="#FFB703" />

    <!-- 4. Column Stem & Rings -->
    <!-- Mid rings -->
    <ellipse cx="300" cy="336" rx="20" ry="7" fill="#FFE500" />
    <ellipse cx="300" cy="348" rx="16" ry="6" fill="#FFC000" />
    <!-- Fluted central stem -->
    <path d="M 286 352 C 288 380 285 400 282 410 L 318 410 C 315 400 312 380 314 352 Z" fill="#FFD700" />
    <!-- Fluting lines -->
    <line x1="294" y1="354" x2="292" y2="408" stroke="#B91C1C" stroke-width="1.8" />
    <line x1="300" y1="354" x2="300" y2="408" stroke="#B91C1C" stroke-width="1.8" />
    <line x1="306" y1="354" x2="308" y2="408" stroke="#B91C1C" stroke-width="1.8" />

    <!-- 5. Tiered Circular Pedestal Base -->
    <ellipse cx="300" cy="414" rx="28" ry="8" fill="#FFE033" />
    <ellipse cx="300" cy="428" rx="68" ry="18" fill="#FFCA3A" />
    <path d="M 232 428 C 234 452 366 452 368 428 Z" fill="#F59E0B" />
    
    <!-- Bottom Rim Ring -->
    <ellipse cx="300" cy="460" rx="92" ry="22" fill="#FFE500" />
    <path d="M 208 460 C 212 486 388 486 392 460 Z" fill="#D97706" />
    <ellipse cx="300" cy="478" rx="84" ry="18" fill="#FFB703" />
  </g>
</svg>
